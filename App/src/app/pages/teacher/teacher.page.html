<ion-header translucent="true">
  <ion-toolbar>
    <ion-title>Teacher Dashboard</ion-title>
    <ion-button slot="end" fill="clear" color="medium" (click)="logout()">Sign out</ion-button>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen="true" class="dash-shell">
  <section class="summary">
    <div class="pill">
      <span>User</span>
      <strong>{{ auth?.username || '—' }}</strong>
    </div>
    <div class="pill">
      <span>School</span>
      <strong>{{ auth?.schoolId || '—' }}</strong>
    </div>
  </section>

  <ion-grid fixed>
    <ion-row>
      <ion-col size="12">
        <ion-card>
          <ion-card-content>
            <p class="panel-title">Available Subjects</p>
            <ul>
              <li *ngFor="let s of subjects">{{ s.name }} (stage {{ s.stage }})</li>
            </ul>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
