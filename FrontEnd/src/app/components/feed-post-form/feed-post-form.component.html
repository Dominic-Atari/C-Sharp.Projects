<ion-card class="post-card" mode="ios">
  <ion-card-content>
    <div class="form-header">
      <div>
        <p class="eyebrow">Create</p>
        <h3>Share an update</h3>
      </div>
      <ion-note>What are you working on?</ion-note>
    </div>

    <ion-item lines="none">
      <ion-input
        label="Name"
        label-placement="stacked"
        placeholder="Your name"
        [(ngModel)]="author"
        type="text"
      ></ion-input>
    </ion-item>

    <ion-item lines="none">
      <ion-textarea
        label="Message"
        label-placement="stacked"
        placeholder="Share something with the community"
        auto-grow="true"
        [(ngModel)]="message"
      ></ion-textarea>
    </ion-item>

    <ion-button expand="block" shape="round" class="submit-button" (click)="submit()">
      Post
    </ion-button>
  </ion-card-content>
</ion-card>
