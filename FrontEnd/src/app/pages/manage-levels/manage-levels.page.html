<ion-header>
  <ion-toolbar>
    <ion-title>Manage Levels</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="addStage()">Add</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="page-root">
  <ion-list *ngIf="!loading">
    <ion-item *ngFor="let s of stages">
      <ion-label>
        <h3>{{ s.name }}</h3>
        <p class="muted">{{ s.label || '' }} {{ s.description ? '• ' + s.description : '' }}</p>
      </ion-label>
      <ion-buttons slot="start" class="stage-left-actions">
        <ion-button fill="clear" size="small" (click)="editStage(s)" title="Edit level">Edit</ion-button>
        <ion-button color="danger" fill="clear" size="small" (click)="deleteStageConfirm(s)" title="Delete level">Delete</ion-button>
      </ion-buttons>
      <ion-buttons slot="end" class="stage-right-actions">
        <ion-button fill="clear" (click)="addSubLevel(s)">Add sublevel</ion-button>
      </ion-buttons>

      <!-- Dropdown selector for SubLevels (keeps UI compact for many sublevels) -->
      <div class="sublevel-row">
        <ion-item lines="none">
          <ion-label class="sublevel-select-label">Sublevel</ion-label>
          <ion-select [value]="selectedSubLevel[s.stageId]" (ionChange)="onSubLevelSelected(s.stageId, $any($event).detail.value)">
            <ion-select-option *ngIf="!(sublevels[s.stageId] || []).length" value="" disabled>No sublevels</ion-select-option>
            <ion-select-option *ngFor="let sl of sublevels[s.stageId] || []" [value]="sl.subLevelId">{{ sl.name }}</ion-select-option>
          </ion-select>
          <ion-buttons slot="end" class="sublevel-actions">
            <ion-button size="small" fill="clear" (click)="editSubLevel(s, getSubLevelById(s.stageId, selectedSubLevel[s.stageId])!)" [disabled]="!selectedSubLevel[s.stageId]">Edit</ion-button>
            <ion-button size="small" color="danger" fill="clear" (click)="deleteSubLevelConfirm(s, getSubLevelById(s.stageId, selectedSubLevel[s.stageId])!)" [disabled]="!selectedSubLevel[s.stageId]">Delete</ion-button>
          </ion-buttons>
        </ion-item>
      </div>
    </ion-item>
    <ion-item *ngIf="stages.length === 0">No levels defined</ion-item>
  </ion-list>
  <div *ngIf="loading" class="loading-wrap">Loading…</div>
</ion-content>
