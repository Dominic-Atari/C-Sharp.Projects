<ion-header>
  <ion-toolbar>
    <ion-title>Admin Dashboard</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card title="Admin dashboard panel">
    <ion-card-content>
      <h2>Welcome, admin</h2>
      <p>Use this dashboard to manage the school, users and content.</p>
    </ion-card-content>
  </ion-card>
  <ion-item *ngIf="sublevels.length">
    <ion-label position="stacked">Sublevel (optional)</ion-label>
    <ion-select formControlName="subLevelId">
      <ion-select-option *ngFor="let sl of sublevels" [value]="sl.subLevelId">{{ sl.name }}</ion-select-option>
    </ion-select>
  </ion-item>
</ion-content>
